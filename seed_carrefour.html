function log(msg, color='#7fff7f'){
  const el=document.getElementById('log');
  el.innerHTML+=`<span style="color:${color}">${msg}</span>\n`;
  el.scrollTop=el.scrollHeight;
}

async function apiGet(path){
  const res=await fetch(SUPA_URL+'/rest/v1/'+path,{headers:HDR});
  if(!res.ok)throw new Error(await res.text());
  return res.json();
}
async function apiPost(path,body){
  const res=await fetch(SUPA_URL+'/rest/v1/'+path,{method:'POST',headers:{...HDR,'Prefer':'return=representation'},body:JSON.stringify(body)});
  if(!res.ok)throw new Error(await res.text());
  return res.json();
}
async function apiPatch(path,body){
  const res=await fetch(SUPA_URL+'/rest/v1/'+path,{method:'PATCH',headers:{...HDR,'Prefer':'return=representation'},body:JSON.stringify(body)});
  if(!res.ok)throw new Error(await res.text());
  return res.json();
}

async function runSeed(){
  document.getElementById('btn-run').disabled=true;
  document.getElementById('log').innerHTML='';
  log('🚀 A iniciar seed...','#fff');

  try{
    // 1. Buscar produtos existentes
    log('\n📦 A verificar produtos existentes...');
    const existing=await apiGet('margens?select=id,nome,categoria');
    log(`   ${existing.length} produto(s) encontrado(s) no Supabase.`);

    // 2. Para cada produto do seed
    for(const p of PRODUTOS){
      const match=existing.find(e=>e.nome.toLowerCase()===p.nome.toLowerCase());
      let margemId;

      if(match){
        log(`   ✓ Já existe: ${p.nome}`,'#aaffaa');
        margemId=match.id;
        // Atualiza dados base
        await apiPatch(`margens?id=eq.${margemId}`,{
          custo:p.custo, pvp:p.pvp,
          retalho_liq:p.retalho_liq, retalho_bruto:p.retalho_bruto, taxa_retalho:p.taxa_retalho,
          categoria:p.categoria, material:p.material, ean:p.ean
        });
      }else{
        log(`   + A criar: ${p.nome}`,'#ffff88');
        const[saved]=await apiPost('margens',{
          nome:p.nome, categoria:p.categoria, custo:p.custo, pvp:p.pvp,
          retalho_liq:p.retalho_liq, retalho_bruto:p.retalho_bruto, taxa_retalho:p.taxa_retalho,
          horeca_liq:null, horeca_bruto:null, dist_liq:null, dist_bruto:null,
          material:p.material, ean:p.ean
        });
        margemId=saved.id;
      }

      // 3. Dados Carrefour
      const existingCR=await apiGet(`clientes_retalho?margem_id=eq.${margemId}&cliente=eq.carrefour`);
      if(existingCR.length>0){
        await apiPatch(`clientes_retalho?id=eq.${existingCR[0].id}`,{...p.carrefour,status:p.status||'Disponivel'});
        log(`     📋 Carrefour atualizado`,'#aaddff');
      }else{
        await apiPost('clientes_retalho',{cliente:'carrefour',margem_id:margemId,...p.carrefour,status:p.status||'Disponivel'});
        log(`     📋 Carrefour criado`,'#aaddff');
      }
    }

    log('\n✅ Seed concluído com sucesso!','#00ff88');
    log('Podes fechar esta página e voltar à app.','#fff');
  }catch(e){
    log('\n❌ Erro: '+e.message,'#ff6666');
    console.error(e);
  }
  document.getElementById('btn-run').disabled=false;
}
