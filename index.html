<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Panini 2026">
<meta name="theme-color" content="#1a0a2e">
<title>Panini FIFA World Cup 2026™</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700;900&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --gold: #D4AF37;
  --gold2: #FFD700;
  --bg: #0a0a1a;
  --bg2: #111128;
  --bg3: #1a1a38;
  --green: #00e676;
  --red: #ff4466;
  --purple: #8866ff;
  --text: #f0f0f0;
  --text2: rgba(240,240,240,0.55);
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; overflow: hidden; }
body {
  font-family: 'Barlow', sans-serif;
  background: var(--bg);
  color: var(--text);
  display: flex; flex-direction: column;
}

/* ── SCREENS ── */
.screen { display: none; flex-direction: column; height: 100vh; overflow: hidden; }
.screen.active { display: flex; }

/* ── SPLASH ── */
#screen-splash {
  background: linear-gradient(160deg, #0a0a1a 0%, #1a0a2e 50%, #0d1a2e 100%);
  align-items: center; justify-content: center; gap: 20px;
}
.splash-ball { font-size: 72px; animation: bounce 1.2s ease-in-out infinite; }
@keyframes bounce { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-18px)} }
.splash-title { font-family:'Barlow Condensed',sans-serif; font-size: 28px; font-weight: 900; color: var(--gold); letter-spacing: 3px; text-transform: uppercase; text-align: center; }
.splash-sub { font-size: 12px; color: var(--text2); letter-spacing: 2px; text-transform: uppercase; }
.splash-loading { display: flex; gap: 6px; }
.splash-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--gold); animation: pulse 1s ease-in-out infinite; }
.splash-dot:nth-child(2) { animation-delay: 0.2s; }
.splash-dot:nth-child(3) { animation-delay: 0.4s; }
@keyframes pulse { 0%,100%{opacity:0.3;transform:scale(0.8)} 50%{opacity:1;transform:scale(1.2)} }

/* ── HOME ── */
#screen-home { background: var(--bg); }
.home-header {
  background: linear-gradient(135deg, #1a0a2e, #0a1a2e);
  padding: 20px 20px 16px;
  border-bottom: 2px solid var(--gold);
}
.home-header h1 { font-family:'Barlow Condensed',sans-serif; font-size: 22px; font-weight: 900; color: var(--gold); letter-spacing: 2px; text-transform: uppercase; }
.home-header p { font-size: 12px; color: var(--text2); margin-top: 2px; }
.home-body { flex: 1; overflow-y: auto; padding: 16px; }
.colecoes-list { display: flex; flex-direction: column; gap: 10px; }
.colecao-card {
  background: linear-gradient(135deg, var(--bg2), var(--bg3));
  border: 1px solid rgba(212,175,55,0.25);
  border-radius: 14px; padding: 14px 16px;
  cursor: pointer; transition: all 0.2s;
  display: flex; align-items: center; gap: 12px;
}
.colecao-card:active { transform: scale(0.98); border-color: var(--gold); }
.colecao-avatar {
  width: 46px; height: 46px; border-radius: 50%;
  background: linear-gradient(135deg, var(--gold), var(--gold2));
  display: flex; align-items: center; justify-content: center;
  font-family:'Barlow Condensed',sans-serif; font-size: 20px; font-weight: 900; color: var(--bg);
  flex-shrink: 0;
}
.colecao-info { flex: 1; }
.colecao-nome { font-family:'Barlow Condensed',sans-serif; font-size: 18px; font-weight: 700; }
.colecao-stats { font-size: 12px; color: var(--text2); margin-top: 2px; }
.colecao-pct {
  font-family:'Barlow Condensed',sans-serif; font-size: 22px; font-weight: 900; color: var(--gold);
}
.pct-bar-wrap { height: 4px; background: rgba(255,255,255,0.1); border-radius: 2px; margin-top: 6px; }
.pct-bar { height: 100%; border-radius: 2px; background: linear-gradient(90deg, var(--gold), var(--gold2)); transition: width 0.5s; }
.btn-nova-colecao {
  margin-top: 16px; width: 100%; padding: 14px;
  background: linear-gradient(135deg, rgba(212,175,55,0.15), rgba(212,175,55,0.05));
  border: 2px dashed rgba(212,175,55,0.4);
  border-radius: 14px; color: var(--gold);
  font-family:'Barlow Condensed',sans-serif; font-size: 16px; font-weight: 700;
  letter-spacing: 1px; cursor: pointer; transition: all 0.2s;
}
.btn-nova-colecao:active { background: rgba(212,175,55,0.2); }
.empty-home { text-align: center; padding: 60px 20px; color: var(--text2); }
.empty-home .emoji { font-size: 48px; margin-bottom: 12px; }
.empty-home p { font-size: 14px; line-height: 1.6; }

/* ── MODAL ── */
.modal-overlay {
  position: fixed; inset: 0; background: rgba(0,0,0,0.75);
  display: none; align-items: flex-end; justify-content: center;
  z-index: 1000; backdrop-filter: blur(4px);
}
.modal-overlay.open { display: flex; }
.modal {
  background: linear-gradient(160deg, #1a1a38, #111128);
  border: 1px solid rgba(212,175,55,0.3);
  border-radius: 24px 24px 0 0;
  padding: 24px 20px 40px;
  width: 100%; max-width: 480px;
  animation: slideUp 0.3s ease;
}
@keyframes slideUp { from{transform:translateY(100%)} to{transform:translateY(0)} }
.modal h2 { font-family:'Barlow Condensed',sans-serif; font-size: 22px; font-weight: 900; color: var(--gold); margin-bottom: 20px; }
.modal-input {
  width: 100%; padding: 13px 16px; margin-bottom: 12px;
  background: var(--bg); border: 1px solid rgba(212,175,55,0.3);
  border-radius: 10px; color: var(--text); font-size: 16px; outline: none;
  font-family: 'Barlow', sans-serif;
}
.modal-input:focus { border-color: var(--gold); }
.pin-display {
  display: flex; gap: 10px; justify-content: center; margin: 16px 0;
}
.pin-dot {
  width: 18px; height: 18px; border-radius: 50%;
  border: 2px solid rgba(212,175,55,0.4);
  transition: all 0.2s;
}
.pin-dot.filled { background: var(--gold); border-color: var(--gold); }
.pin-pad {
  display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin: 12px 0;
}
.pin-key {
  padding: 16px; background: var(--bg3); border: 1px solid rgba(255,255,255,0.08);
  border-radius: 12px; color: var(--text); font-size: 22px; font-weight: 700;
  cursor: pointer; text-align: center; transition: all 0.15s;
  font-family: 'Barlow Condensed', sans-serif;
}
.pin-key:active { background: rgba(212,175,55,0.2); transform: scale(0.95); }
.pin-key.del { font-size: 18px; color: var(--text2); }
.modal-btn {
  width: 100%; padding: 14px; border-radius: 12px; border: none;
  font-family:'Barlow Condensed',sans-serif; font-size: 17px; font-weight: 700;
  letter-spacing: 1px; cursor: pointer; margin-top: 8px; transition: all 0.2s;
}
.modal-btn.primary { background: linear-gradient(135deg, var(--gold), var(--gold2)); color: var(--bg); }
.modal-btn.secondary { background: rgba(255,255,255,0.06); color: var(--text2); border: 1px solid rgba(255,255,255,0.1); }
.modal-btn:active { transform: scale(0.98); }
.modal-error { color: var(--red); font-size: 13px; text-align: center; margin-top: 8px; min-height: 18px; }
.modal-label { font-size: 12px; color: var(--text2); margin-bottom: 6px; letter-spacing: 1px; text-transform: uppercase; }

/* ── COLECAO VIEW ── */
#screen-colecao { background: var(--bg); }
.col-header {
  background: linear-gradient(135deg, #1a0a2e, #0a1a2e);
  padding: 12px 16px 10px;
  border-bottom: 2px solid var(--gold);
}
.col-header-top { display: flex; align-items: center; gap: 10px; margin-bottom: 6px; }
.btn-back {
  background: none; border: none; color: var(--gold); font-size: 22px; cursor: pointer; padding: 2px 6px;
}
.col-header-title { font-family:'Barlow Condensed',sans-serif; font-size: 20px; font-weight: 900; color: var(--gold); flex: 1; }
.btn-edit-col {
  background: rgba(212,175,55,0.15); border: 1px solid rgba(212,175,55,0.3);
  border-radius: 8px; color: var(--gold); font-size: 12px; font-weight: 700;
  padding: 5px 10px; cursor: pointer;
}
.col-progress-bar { height: 5px; background: rgba(255,255,255,0.1); border-radius: 3px; }
.col-progress-fill { height: 100%; border-radius: 3px; background: linear-gradient(90deg, var(--green), #00b348); transition: width 0.4s; }

/* NAV TABS */
.col-nav { display: flex; background: var(--bg2); border-bottom: 1px solid rgba(212,175,55,0.2); }
.col-nav-btn {
  flex: 1; padding: 10px 4px; background: none; border: none;
  color: var(--text2); font-size: clamp(9px, 2.3vw, 12px); font-weight: 700;
  cursor: pointer; letter-spacing: 0.3px; transition: all 0.2s;
  white-space: nowrap; border-bottom: 2px solid transparent;
}
.col-nav-btn.active { color: var(--gold); border-bottom-color: var(--gold); }

/* CONTROLS */
.col-controls { padding: 8px 12px; background: var(--bg); display: flex; gap: 7px; flex-wrap: wrap; border-bottom: 1px solid rgba(255,255,255,0.05); }
.col-search { flex: 1 1 150px; padding: 8px 12px; background: var(--bg3); border: 1px solid rgba(212,175,55,0.3); border-radius: 8px; color: var(--text); font-size: 14px; outline: none; }
.col-select { flex: 1 1 120px; padding: 8px; background: var(--bg3); border: 1px solid rgba(212,175,55,0.3); border-radius: 8px; color: var(--text); font-size: 12px; outline: none; }

/* LIST */
.col-status { padding: 4px 14px; font-size: 11px; color: var(--text2); background: var(--bg); }
.col-list { flex: 1; overflow-y: auto; padding: 6px 10px 80px; }
.sticker-row {
  display: flex; align-items: center; gap: 8px;
  padding: 7px 9px; margin-bottom: 3px; border-radius: 8px;
  background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.05);
  transition: all 0.15s;
}
.sticker-row.owned { background: rgba(0,230,118,0.07); border-color: rgba(0,230,118,0.18); }
.sticker-row.readonly { pointer-events: none; }
.s-id { min-width: 50px; padding: 2px 5px; border-radius: 4px; font-family:'Barlow Condensed',sans-serif; font-size: 11px; font-weight: 800; text-align: center; background: var(--bg3); color: var(--text); }
.s-id.owned { background: var(--green); color: var(--bg); }
.s-id.special { background: linear-gradient(135deg, var(--gold), var(--gold2)); color: var(--bg); }
.s-name { flex: 1; font-size: clamp(11px, 2.8vw, 13px); line-height: 1.3; cursor: pointer; }
.s-dup { margin-left: 5px; background: var(--purple); border-radius: 10px; padding: 1px 6px; font-size: 10px; font-weight: 700; color: #fff; }
.s-controls { display: flex; align-items: center; gap: 3px; }
.s-btn { width: 28px; height: 28px; border-radius: 50%; border: 1px solid rgba(212,175,55,0.4); background: rgba(212,175,55,0.08); color: var(--gold); cursor: pointer; font-size: 18px; line-height: 26px; text-align: center; font-weight: 700; padding: 0; }
.s-count { min-width: 22px; text-align: center; font-weight: 700; font-size: 14px; color: var(--gold); }
.empty-list { text-align: center; padding: 40px 16px; color: var(--text2); font-size: 14px; }

/* STATS */
.stats-wrap { flex: 1; overflow-y: auto; padding: 12px; }
.stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 14px; }
.stat-card { border-radius: 12px; padding: 14px; text-align: center; }
.stat-num { font-family:'Barlow Condensed',sans-serif; font-size: clamp(30px,8vw,44px); font-weight: 900; line-height: 1; }
.stat-lbl { font-size: 10px; color: var(--text2); text-transform: uppercase; letter-spacing: 1px; margin-top: 3px; }
.big-prog-bar { height: 10px; background: rgba(255,255,255,0.08); border-radius: 5px; overflow: hidden; margin-bottom: 6px; }
.big-prog-fill { height: 100%; background: linear-gradient(90deg, var(--gold), var(--gold2)); border-radius: 5px; transition: width 0.5s; }
.section-title { font-family:'Barlow Condensed',sans-serif; font-size: 13px; font-weight: 700; color: var(--gold); letter-spacing: 1px; text-transform: uppercase; margin: 14px 0 8px; }
.team-prog-row { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
.team-prog-lbl { width: 115px; font-size: 11px; text-align: right; color: var(--text2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.team-prog-bar { flex: 1; height: 8px; background: rgba(255,255,255,0.08); border-radius: 4px; overflow: hidden; }
.team-prog-fill { height: 100%; border-radius: 4px; transition: width 0.4s; }
.team-prog-ct { font-size: 10px; min-width: 34px; text-align: right; color: var(--text2); }

/* TROCAS */
.trocas-wrap { flex: 1; overflow-y: auto; padding: 12px; }
.troca-section { margin-bottom: 20px; }
.troca-header { font-family:'Barlow Condensed',sans-serif; font-size: 14px; font-weight: 700; color: var(--gold); letter-spacing: 1px; text-transform: uppercase; margin-bottom: 8px; padding-bottom: 6px; border-bottom: 1px solid rgba(212,175,55,0.2); }
.match-card {
  background: linear-gradient(135deg, rgba(0,230,118,0.08), rgba(0,230,118,0.03));
  border: 1px solid rgba(0,230,118,0.25); border-radius: 10px;
  padding: 10px 12px; margin-bottom: 6px;
}
.match-card .match-title { font-size: 12px; font-weight: 700; color: var(--green); margin-bottom: 4px; }
.match-card .match-detail { font-size: 11px; color: var(--text2); line-height: 1.5; }
.offer-card {
  background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.07);
  border-radius: 10px; padding: 10px 12px; margin-bottom: 6px;
}
.offer-who { font-size: 12px; font-weight: 700; color: var(--text); margin-bottom: 3px; }
.offer-stickers { font-size: 11px; color: var(--text2); line-height: 1.6; }
.offer-tag { display: inline-block; background: var(--bg3); border: 1px solid rgba(212,175,55,0.3); border-radius: 4px; padding: 1px 5px; margin: 1px; font-size: 10px; color: var(--gold); font-family:'Barlow Condensed',sans-serif; font-weight: 700; }
.no-trocas { text-align: center; padding: 30px 16px; color: var(--text2); font-size: 13px; }

/* TOAST */
.toast {
  position: fixed; bottom: 80px; left: 50%; transform: translateX(-50%) translateY(20px);
  background: #1a3a1a; border: 1px solid var(--green); color: var(--green);
  padding: 10px 20px; border-radius: 20px; font-size: 13px; font-weight: 700;
  opacity: 0; transition: all 0.3s; z-index: 2000; white-space: nowrap;
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
.toast.error { background: #3a1a1a; border-color: var(--red); color: var(--red); }

/* LOADING */
.loading-overlay {
  position: fixed; inset: 0; background: rgba(10,10,26,0.85);
  display: none; align-items: center; justify-content: center; z-index: 3000;
  flex-direction: column; gap: 12px;
}
.loading-overlay.show { display: flex; }
.loading-spinner { width: 36px; height: 36px; border: 3px solid rgba(212,175,55,0.2); border-top-color: var(--gold); border-radius: 50%; animation: spin 0.8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.loading-text { font-size: 13px; color: var(--text2); }
</style>
</head>
<body>

<!-- LOADING -->
<div class="loading-overlay" id="loading">
  <div class="loading-spinner"></div>
  <div class="loading-text" id="loading-text">A carregar...</div>
</div>

<!-- TOAST -->
<div class="toast" id="toast"></div>

<!-- SPLASH -->
<div class="screen active" id="screen-splash">
  <div class="splash-ball">⚽</div>
  <div class="splash-title">Panini FIFA<br>World Cup 2026™</div>
  <div class="splash-sub">Gestor de Cromos</div>
  <div class="splash-loading">
    <div class="splash-dot"></div>
    <div class="splash-dot"></div>
    <div class="splash-dot"></div>
  </div>
</div>

<!-- HOME -->
<div class="screen" id="screen-home">
  <div class="home-header">
    <h1>⭐ Panini 2026™</h1>
    <p>Escolhe ou cria a tua coleção</p>
  </div>
  <div class="home-body">
    <div class="colecoes-list" id="colecoes-list">
      <div class="empty-home">
        <div class="emoji">📦</div>
        <p>Ainda não há coleções.<br>Cria a primeira!</p>
      </div>
    </div>
    <button class="btn-nova-colecao" onclick="abrirModalNova()">＋ Nova Coleção</button>
  </div>
</div>

<!-- MODAL NOVA COLEÇÃO -->
<div class="modal-overlay" id="modal-nova">
  <div class="modal">
    <h2>Nova Coleção</h2>
    <div class="modal-label">Nome</div>
    <input class="modal-input" id="nova-nome" type="text" placeholder="Ex: Santiago" maxlength="20" autocomplete="off">
    <div class="modal-label" style="margin-top:12px">PIN de 4 dígitos</div>
    <div class="pin-display" id="nova-pin-display">
      <div class="pin-dot" id="ndot0"></div>
      <div class="pin-dot" id="ndot1"></div>
      <div class="pin-dot" id="ndot2"></div>
      <div class="pin-dot" id="ndot3"></div>
    </div>
    <div class="pin-pad">
      <button class="pin-key" onclick="pinKey('nova',1)">1</button>
      <button class="pin-key" onclick="pinKey('nova',2)">2</button>
      <button class="pin-key" onclick="pinKey('nova',3)">3</button>
      <button class="pin-key" onclick="pinKey('nova',4)">4</button>
      <button class="pin-key" onclick="pinKey('nova',5)">5</button>
      <button class="pin-key" onclick="pinKey('nova',6)">6</button>
      <button class="pin-key" onclick="pinKey('nova',7)">7</button>
      <button class="pin-key" onclick="pinKey('nova',8)">8</button>
      <button class="pin-key" onclick="pinKey('nova',9)">9</button>
      <button class="pin-key del" onclick="pinKey('nova','del')">⌫</button>
      <button class="pin-key" onclick="pinKey('nova',0)">0</button>
      <button class="pin-key del" onclick="pinKey('nova','clr')">✕</button>
    </div>
    <div class="modal-error" id="nova-error"></div>
    <button class="modal-btn primary" onclick="criarColecao()">Criar Coleção</button>
    <button class="modal-btn secondary" onclick="fecharModal('modal-nova')">Cancelar</button>
  </div>
</div>

<!-- MODAL PIN (entrar/editar) -->
<div class="modal-overlay" id="modal-pin">
  <div class="modal">
    <h2 id="pin-modal-title">Inserir PIN</h2>
    <p style="font-size:13px;color:var(--text2);margin-bottom:16px" id="pin-modal-sub">Para editar a coleção de <strong id="pin-nome-span"></strong></p>
    <div class="pin-display">
      <div class="pin-dot" id="pdot0"></div>
      <div class="pin-dot" id="pdot1"></div>
      <div class="pin-dot" id="pdot2"></div>
      <div class="pin-dot" id="pdot3"></div>
    </div>
    <div class="pin-pad">
      <button class="pin-key" onclick="pinKey('enter',1)">1</button>
      <button class="pin-key" onclick="pinKey('enter',2)">2</button>
      <button class="pin-key" onclick="pinKey('enter',3)">3</button>
      <button class="pin-key" onclick="pinKey('enter',4)">4</button>
      <button class="pin-key" onclick="pinKey('enter',5)">5</button>
      <button class="pin-key" onclick="pinKey('enter',6)">6</button>
      <button class="pin-key" onclick="pinKey('enter',7)">7</button>
      <button class="pin-key" onclick="pinKey('enter',8)">8</button>
      <button class="pin-key" onclick="pinKey('enter',9)">9</button>
      <button class="pin-key del" onclick="pinKey('enter','del')">⌫</button>
      <button class="pin-key" onclick="pinKey('enter',0)">0</button>
      <button class="pin-key del" onclick="pinKey('enter','clr')">✕</button>
    </div>
    <div class="modal-error" id="pin-error"></div>
    <button class="modal-btn secondary" onclick="abrirColecaoReadonly()">👁 Só Visualizar</button>
    <button class="modal-btn secondary" style="margin-top:6px" onclick="fecharModal('modal-pin')">Cancelar</button>
  </div>
</div>

<!-- COLECAO VIEW -->
<div class="screen" id="screen-colecao">
  <div class="col-header">
    <div class="col-header-top">
      <button class="btn-back" onclick="voltarHome()">‹</button>
      <div class="col-header-title" id="col-title">Coleção</div>
      <div style="font-size:11px;color:var(--text2);text-align:right">
        <span id="col-mode-badge" style="padding:3px 8px;border-radius:6px;font-weight:700;font-size:10px"></span>
      </div>
      <button class="btn-edit-col" id="btn-editar-col" onclick="pedirPin()" style="display:none">🔓 Editar</button>
    </div>
    <div class="col-progress-bar"><div class="col-progress-fill" id="col-prog-fill"></div></div>
  </div>

  <div class="col-nav">
    <button class="col-nav-btn active" onclick="mudarTab('colecao',this)">📚 Coleção</button>
    <button class="col-nav-btn" onclick="mudarTab('falta',this)">❌ Falta</button>
    <button class="col-nav-btn" onclick="mudarTab('repetidos',this)">🔁 Repetidos</button>
    <button class="col-nav-btn" onclick="mudarTab('trocas',this)">🤝 Trocas</button>
    <button class="col-nav-btn" onclick="mudarTab('resumo',this)">📊 Resumo</button>
  </div>

  <!-- Lista de cromos -->

}

// ─── STATE ────────────────────────────────────────────────────────────────────
let colecoes = [];           // lista carregada do Supabase
let colAtual = null;         // {id, nome, pin_hash}
let colCromos = {};          // {cromo_id: quantidade}
let allColCromos = {};       // {colecao_id: {cromo_id: quantidade}}
let modoEdicao = false;
let currentTab = "colecao";
let pinBuffer = { nova: "", enter: "" };
let pendingColecaoId = null;

// ─── UI HELPERS ───────────────────────────────────────────────────────────────
function showScreen(id) {
  document.querySelectorAll(".screen").forEach(s => s.classList.remove("active"));
  document.getElementById("screen-"+id).classList.add("active");
}
function showLoading(txt="A carregar...") {
  document.getElementById("loading-text").textContent = txt;
  document.getElementById("loading").classList.add("show");
}
function hideLoading() { document.getElementById("loading").classList.remove("show"); }
function toast(msg, error=false) {
  const t = document.getElementById("toast");
  t.textContent = msg; t.className = "toast show" + (error?" error":"");
  setTimeout(() => t.className = "toast", 2500);
}
function fecharModal(id) { document.getElementById(id).classList.remove("open"); }
function abrirModal(id) { document.getElementById(id).classList.add("open"); }

// ─── PIN PAD ──────────────────────────────────────────────────────────────────
function pinKey(ctx, val) {
  const buf = pinBuffer[ctx] || "";
  if (val === "clr") { pinBuffer[ctx] = ""; }
  else if (val === "del") { pinBuffer[ctx] = buf.slice(0,-1); }
  else if (buf.length < 4) { pinBuffer[ctx] = buf + val; }
  updatePinDisplay(ctx);
  if (ctx === "enter" && pinBuffer[ctx].length === 4) setTimeout(() => verificarPin(), 200);
}
function updatePinDisplay(ctx) {
  const buf = pinBuffer[ctx] || "";
  const prefix = ctx === "nova" ? "ndot" : "pdot";
  for (let i=0; i<4; i++) {
    document.getElementById(prefix+i).classList.toggle("filled", i < buf.length);
  }
}

// ─── NOVA COLEÇÃO ─────────────────────────────────────────────────────────────
function abrirModalNova() {
  pinBuffer.nova = "";
  document.getElementById("nova-nome").value = "";
  document.getElementById("nova-error").textContent = "";
  updatePinDisplay("nova");
  abrirModal("modal-nova");
  setTimeout(() => document.getElementById("nova-nome").focus(), 300);
}

async function criarColecao() {
  const nome = document.getElementById("nova-nome").value.trim();
  const pin = pinBuffer.nova;
  const err = document.getElementById("nova-error");
  if (!nome) { err.textContent = "Escreve um nome."; return; }
  if (pin.length !== 4) { err.textContent = "O PIN tem de ter 4 dígitos."; return; }
  if (colecoes.find(c => c.nome.toLowerCase() === nome.toLowerCase())) {
    err.textContent = "Já existe uma coleção com esse nome."; return;
  }
  showLoading("A criar coleção...");
  fecharModal("modal-nova");
  try {
    const res = await api("POST", "colecoes", { nome, pin_hash: hashPin(pin) });
    const nova = Array.isArray(res) ? res[0] : res;
    colecoes.push(nova);
    renderHome();
    toast("✅ Coleção criada!");
  } catch(e) {
    toast("Erro ao criar coleção", true);
  }
  hideLoading();
}

// ─── ABRIR COLEÇÃO ────────────────────────────────────────────────────────────
function abrirColecaoCard(colId) {
  const col = colecoes.find(c => c.id === colId);
  if (!col) return;
  pendingColecaoId = colId;
  pinBuffer.enter = "";
  updatePinDisplay("enter");
  document.getElementById("pin-nome-span").textContent = col.nome;
  document.getElementById("pin-error").textContent = "";
  document.getElementById("pin-modal-title").textContent = `Coleção de ${col.nome}`;
  abrirModal("modal-pin");
}

function verificarPin() {
  const col = colecoes.find(c => c.id === pendingColecaoId);
  if (!col) return;
  if (hashPin(pinBuffer.enter) === col.pin_hash) {
    fecharModal("modal-pin");
    abrirColecao(pendingColecaoId, true);
  } else {
    document.getElementById("pin-error").textContent = "PIN incorreto. Tenta outra vez.";
    pinBuffer.enter = "";
    updatePinDisplay("enter");
  }
}

function abrirColecaoReadonly() {
  fecharModal("modal-pin");
  abrirColecao(pendingColecaoId, false);
}

function pedirPin() {
  pinBuffer.enter = "";
  updatePinDisplay("enter");
  document.getElementById("pin-nome-span").textContent = colAtual.nome;
  document.getElementById("pin-error").textContent = "";
  abrirModal("modal-pin");
}

async function abrirColecao(colId, editar) {
  const col = colecoes.find(c => c.id === colId);
  colAtual = col;
  modoEdicao = editar;
  showLoading("A carregar cromos...");
  try {
    // Carregar cromos desta coleção
    const rows = await api("GET", `cromos?colecao_id=eq.${colId}&select=cromo_id,quantidade`);
    colCromos = {};
    (rows||[]).forEach(r => { colCromos[r.cromo_id] = r.quantidade; });

    // Carregar cromos de todas as outras coleções (para trocas)
    allColCromos = {};
    for (const c of colecoes) {
      if (c.id === colId) continue;
      const r2 = await api("GET", `cromos?colecao_id=eq.${c.id}&select=cromo_id,quantidade`);
      allColCromos[c.id] = {};
      (r2||[]).forEach(r => { allColCromos[c.id][r.cromo_id] = r.quantidade; });
    }

    // Montar select de equipas
    const sel = document.getElementById("col-select");
    sel.innerHTML = "";
    ["Todos","Introdução","Museu FIFA",...TEAMS.map(t=>t.name)].forEach(s => {
      const o = document.createElement("option"); o.value=s; o.textContent=s; sel.appendChild(o);
    });

    document.getElementById("col-title").textContent = col.nome;
    const badge = document.getElementById("col-mode-badge");
    if (editar) {
      badge.textContent = "✏️ A editar"; badge.style.background="rgba(0,230,118,0.15)"; badge.style.color="var(--green)";
      document.getElementById("btn-editar-col").style.display = "none";
    } else {
      badge.textContent = "👁 Só ler"; badge.style.background="rgba(255,255,255,0.08)"; badge.style.color="var(--text2)";
      document.getElementById("btn-editar-col").style.display = "block";
    }

    currentTab = "colecao";
    document.querySelectorAll(".col-nav-btn").forEach((b,i) => b.classList.toggle("active", i===0));
    showTab("colecao");
    showScreen("colecao");
    renderList();
    updateProgress();
  } catch(e) {
    toast("Erro ao carregar coleção", true);
  }
  hideLoading();
}

function voltarHome() { showScreen("home"); renderHome(); }

// ─── TABS ─────────────────────────────────────────────────────────────────────
function mudarTab(tab, btn) {
  currentTab = tab;
  document.querySelectorAll(".col-nav-btn").forEach(b => b.classList.remove("active"));
  btn.classList.add("active");
  showTab(tab);
}

function showTab(tab) {
  const isStats = tab === "resumo";
  const isTrocas = tab === "trocas";
  const isList = !isStats && !isTrocas;
  document.getElementById("tab-list-wrap").style.display = isList ? "flex" : "none";
  document.getElementById("tab-trocas-wrap").style.display = isTrocas ? "flex" : "none";
  document.getElementById("tab-stats-wrap").style.display = isStats ? "flex" : "none";
  if (isList) renderList();
  if (isStats) renderStats();
  if (isTrocas) renderTrocas();
}

// ─── RENDER LIST ──────────────────────────────────────────────────────────────
function renderList() {
  const q = (document.getElementById("col-search").value||"").toLowerCase();
  const sec = document.getElementById("col-select").value || "Todos";
  let list = ALL;
  if (currentTab === "falta") list = list.filter(s => !(colCromos[s.id]>=1));
  if (currentTab === "repetidos") list = list.filter(s => (colCromos[s.id]||0)>1);
  if (sec !== "Todos") list = list.filter(s => s.section === sec);
  if (q) list = list.filter(s => s.name.toLowerCase().includes(q)||s.id.toLowerCase().includes(q));

  const totalDups = ALL.reduce((a,s) => a+Math.max(0,(colCromos[s.id]||0)-1),0);
  const owned = ALL.filter(s=>(colCromos[s.id]||0)>=1).length;
  const st = document.getElementById("col-status");
  if (currentTab==="colecao") st.textContent=`${list.length} cromos • ${owned}/${TOTAL} obtidos`;
  else if (currentTab==="falta") st.textContent=`❌ ${list.length} cromos em falta`;
  else st.textContent=`🔁 ${list.length} com repetidos (${totalDups} para trocar)`;

  const container = document.getElementById("col-list");
  if (list.length===0) { container.innerHTML=`<div class="empty-list">${currentTab==="falta"?"🎉 Nenhum cromo em falta!":currentTab==="repetidos"?"Nenhum repetido.":"Nenhum resultado."}</div>`; return; }

  const ro = !modoEdicao;
  const frag = document.createDocumentFragment();
  list.forEach(s => {
    const cnt = colCromos[s.id]||0;
    const owned = cnt>=1;
    const div = document.createElement("div");
    div.className = "sticker-row"+(owned?" owned":"")+(ro?" readonly":"");
    div.innerHTML = `
      <div class="s-id ${s.special?"special":(owned?"owned":"")}">${s.id}</div>
      <div class="s-name" onclick="${ro?"":"toggle('"+s.id+"')"}">${s.name}${cnt>1?`<span class="s-dup">×${cnt}</span>`:""}</div>
      ${ro ? `<div style="font-size:12px;color:var(--text2);min-width:22px;text-align:center">${cnt||""}</div>` :
        `<div class="s-controls">
          <button class="s-btn" onclick="adj('${s.id}',-1)">−</button>
          <div class="s-count">${cnt}</div>
          <button class="s-btn" onclick="adj('${s.id}',1)">+</button>
        </div>`}`;
    frag.appendChild(div);
  });
  container.innerHTML=""; container.appendChild(frag);
}

// ─── CRUD CROMOS ──────────────────────────────────────────────────────────────
async function toggle(id) {
  const cur = colCromos[id]||0;
  await setCount(id, cur>=1?0:1);
}

async function adj(id, delta) {
  const cur = colCromos[id]||0;
  await setCount(id, Math.max(0,cur+delta));
}

async function setCount(id, qty) {
  const old = colCromos[id]||0;
  // Optimistic update
  if (qty===0) delete colCromos[id]; else colCromos[id]=qty;
  renderList(); updateProgress();
  try {
    if (qty===0) {
      await api("DELETE", `cromos?colecao_id=eq.${colAtual.id}&cromo_id=eq.${id}`);
    } else if (old===0) {
      await api("POST", "cromos", {colecao_id:colAtual.id, cromo_id:id, quantidade:qty});
    } else {
      await api("PATCH", `cromos?colecao_id=eq.${colAtual.id}&cromo_id=eq.${id}`, {quantidade:qty, atualizado_em: new Date().toISOString()});
    }
  } catch(e) {
    // Revert
    if (old===0) delete colCromos[id]; else colCromos[id]=old;
    renderList(); updateProgress();
    toast("Erro ao guardar", true);
  }
}

function updateProgress() {
  const owned = ALL.filter(s=>(colCromos[s.id]||0)>=1).length;
  const pct = Math.round((owned/TOTAL)*100);
  document.getElementById("col-prog-fill").style.width=pct+"%";
}

// ─── TROCAS ───────────────────────────────────────────────────────────────────
function renderTrocas() {
  const container = document.getElementById("trocas-content");
  const outrasColecoes = colecoes.filter(c=>c.id!==colAtual.id);
  if (outrasColecoes.length===0) {
    container.innerHTML=`<div class="no-trocas">🤷 Ainda não há outras coleções para trocar.<br><br>Quando os teus amigos criarem as delas, aqui verás os matches!</div>`;
    return;
  }

  const meusFalta = ALL.filter(s=>!(colCromos[s.id]>=1));
  const meusRep = ALL.filter(s=>(colCromos[s.id]||0)>1);

  let html = "";

  // MATCHES PERFEITOS
  const matches = [];
  for (const col of outrasColecoes) {
    const deles = allColCromos[col.id]||{};
    const delesRep = ALL.filter(s=>(deles[s.id]||0)>1);
    const delesFalta = ALL.filter(s=>!(deles[s.id]>=1));
    // Eu tenho repetido E eles precisam; eles têm repetido E eu preciso
    const euDou = meusRep.filter(s => delesFalta.find(f=>f.id===s.id));
    const elesDao = delesRep.filter(s => meusFalta.find(f=>f.id===s.id));
    if (euDou.length>0 && elesDao.length>0) {
      matches.push({col, euDou, elesDao});
    }
  }

  if (matches.length>0) {
    html += `<div class="troca-section"><div class="troca-header">🤝 Matches Perfeitos</div>`;
    matches.forEach(m => {
      html += `<div class="match-card">
        <div class="match-title">✅ ${colAtual.nome} ↔ ${m.col.nome}</div>
        <div class="match-detail">
          Podes dar: ${m.euDou.slice(0,5).map(s=>`<span class="offer-tag">${s.id}</span>`).join("")}${m.euDou.length>5?`<span class="offer-tag">+${m.euDou.length-5}</span>`:""}<br>
          Recebes: ${m.elesDao.slice(0,5).map(s=>`<span class="offer-tag">${s.id}</span>`).join("")}${m.elesDao.length>5?`<span class="offer-tag">+${m.elesDao.length-5}</span>`:""}
        </div>
      </div>`;
    });
    html += `</div>`;
  }

  // O QUE CADA UM TEM DE REPETIDO QUE PRECISAS
  html += `<div class="troca-section"><div class="troca-header">🎯 Repetidos que precisas</div>`;
  let algum = false;
  for (const col of outrasColecoes) {
    const deles = allColCromos[col.id]||{};
    const util = ALL.filter(s=>(deles[s.id]||0)>1 && !(colCromos[s.id]>=1));
    if (util.length>0) {
      algum = true;
      html += `<div class="offer-card">
        <div class="offer-who">📦 ${col.nome} tem ${util.length} repetido(s) que precisas:</div>
        <div class="offer-stickers">${util.slice(0,10).map(s=>`<span class="offer-tag">${s.id}</span>`).join("")}${util.length>10?`<span class="offer-tag">+${util.length-10} mais</span>`:""}</div>
      </div>`;
    }
  }
  if (!algum) html += `<div class="no-trocas" style="padding:16px">Nenhum repetido útil de momento.</div>`;
  html += `</div>`;

  // OS TEUS REPETIDOS QUE OS OUTROS PRECISAM
  html += `<div class="troca-section"><div class="troca-header">🎁 Os teus repetidos que os outros precisam</div>`;
  let algum2 = false;
  for (const col of outrasColecoes) {
    const deles = allColCromos[col.id]||{};
    const util = meusRep.filter(s=>!(deles[s.id]>=1));
    if (util.length>0) {
      algum2 = true;
      html += `<div class="offer-card">
        <div class="offer-who">🎁 ${col.nome} precisa de ${util.length} cromo(s) que tens repetido:</div>
        <div class="offer-stickers">${util.slice(0,10).map(s=>`<span class="offer-tag">${s.id}</span>`).join("")}${util.length>10?`<span class="offer-tag">+${util.length-10} mais</span>`:""}</div>
      </div>`;
    }
  }
  if (!algum2) html += `<div class="no-trocas" style="padding:16px">Nenhum repetido que os outros precisem.</div>`;
  html += `</div>`;

  container.innerHTML = html;
}

// ─── STATS ────────────────────────────────────────────────────────────────────
function renderStats() {
  const owned = ALL.filter(s=>(colCromos[s.id]||0)>=1).length;
  const missing = TOTAL-owned;
  const pct = Math.round((owned/TOTAL)*100);
  const totalDups = ALL.reduce((a,s)=>a+Math.max(0,(colCromos[s.id]||0)-1),0);

  let html = `
    <div class="stats-grid">
      <div class="stat-card" style="background:linear-gradient(135deg,rgba(0,230,118,.1),rgba(0,230,118,.04));border:1px solid rgba(0,230,118,.25)">
        <div class="stat-num" style="color:var(--green)">${owned}</div>
        <div class="stat-lbl">Obtidos</div>
      </div>
      <div class="stat-card" style="background:linear-gradient(135deg,rgba(255,68,102,.1),rgba(255,68,102,.04));border:1px solid rgba(255,68,102,.25)">
        <div class="stat-num" style="color:var(--red)">${missing}</div>
        <div class="stat-lbl">Em Falta</div>
      </div>
      <div class="stat-card" style="background:linear-gradient(135deg,rgba(212,175,55,.1),rgba(212,175,55,.04));border:1px solid rgba(212,175,55,.25)">
        <div class="stat-num" style="color:var(--gold)">${pct}%</div>
        <div class="stat-lbl">Completo</div>
      </div>
      <div class="stat-card" style="background:linear-gradient(135deg,rgba(136,102,255,.1),rgba(136,102,255,.04));border:1px solid rgba(136,102,255,.25)">
        <div class="stat-num" style="color:var(--purple)">${totalDups}</div>
        <div class="stat-lbl">P/ Trocar</div>
      </div>
    </div>
    <div style="margin:0 4px 14px">
      <div class="big-prog-bar"><div class="big-prog-fill" style="width:${pct}%"></div></div>
      <div style="text-align:center;font-size:12px;color:var(--text2)">${owned} / ${TOTAL} cromos obtidos</div>
    </div>
    <div class="section-title">Progresso por Seleção</div>`;

  TEAMS.forEach(t => {
    const ts = ALL.filter(s=>s.code===t.code);
    const o = ts.filter(s=>(colCromos[s.id]||0)>=1).length;
    const p = Math.round((o/ts.length)*100);
    html += `<div class="team-prog-row">
      <div class="team-prog-lbl">${t.flag} ${t.name}</div>
      <div class="team-prog-bar"><div class="team-prog-fill" style="width:${p}%;background:${p===100?"var(--green)":"var(--gold)"}"></div></div>
      <div class="team-prog-ct" style="color:${p===100?"var(--green)":"var(--text2)"}">${o}/${ts.length}</div>
    </div>`;
  });

  document.getElementById("stats-content").innerHTML = html;
}

// ─── HOME ─────────────────────────────────────────────────────────────────────
function renderHome() {
  const container = document.getElementById("colecoes-list");
  if (colecoes.length===0) {
    container.innerHTML=`<div class="empty-home"><div class="emoji">📦</div><p>Ainda não há coleções.<br>Cria a primeira!</p></div>`;
    return;
  }
  container.innerHTML = colecoes.map(col => {
    const stickers = col._stickers||{};
    const owned = ALL.filter(s=>(stickers[s.id]||0)>=1).length;
    const pct = Math.round((owned/TOTAL)*100);
    const letter = col.nome.charAt(0).toUpperCase();
    return `<div class="colecao-card" onclick="abrirColecaoCard('${col.id}')">
      <div class="colecao-avatar">${letter}</div>
      <div class="colecao-info">
        <div class="colecao-nome">${col.nome}</div>
        <div class="colecao-stats">${owned} / ${TOTAL} cromos • ${pct}%</div>
        <div class="pct-bar-wrap"><div class="pct-bar" style="width:${pct}%"></div></div>
      </div>
      <div class="colecao-pct">${pct}%</div>
    </div>`;
  }).join("");
}

// ─── INIT ─────────────────────────────────────────────────────────────────────
async function init() {
  try {
    const rows = await api("GET", "colecoes?select=id,nome,pin_hash,criado_em&order=criado_em.asc");
    colecoes = rows||[];
    // Carregar contagens para o home (simplificado)
    for (const col of colecoes) {
      const cr = await api("GET", `cromos?colecao_id=eq.${col.id}&select=cromo_id,quantidade`);
      col._stickers = {};
      (cr||[]).forEach(r => col._stickers[r.cromo_id]=r.quantidade);
    }
    renderHome();
    showScreen("home");
  } catch(e) {
    toast("Erro de ligação ao servidor", true);
    showScreen("home");
  }
}

setTimeout(init, 1200);
</script>
